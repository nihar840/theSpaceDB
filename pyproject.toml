[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "theSpaceDB"
version     = "0.1.0"
description = "A self-evolving cognitive database. Blocks in free space. We chase infinity."
readme      = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
fast = ["hnswlib>=0.8"]

[project.scripts]
spacesh = "spacedb.shell:main"
