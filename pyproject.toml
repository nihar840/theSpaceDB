[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "theSpaceDB"
version     = "0.1.0"
description = "A self-evolving cognitive database. Blocks in free space. We chase infinity."
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
fast = ["hnswlib>=0.8"]

[project.scripts]
spacesh = "spacedb.shell:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["spacedb*"]
